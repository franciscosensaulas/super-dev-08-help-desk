<div>
    <h1>Cadastro Categoria</h1>
    <a routerLink="/categorias">Voltar</a>

    <label for="nome">Nome:</label>
    <input [(ngModel)]="form.nome" type="text" id="nome">

    <label for="descricao">Descrição:</label>
    <textarea [(ngModel)]="form.descricao" id="descricao"></textarea>

    <button (click)="cadastrar()">Cadastrar</button>

</div>
