spring.application.name=api-spring

# PostgreSQL
# Cada chave lê a variável de ambiente e caso não existir, usa o valor padrão
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:proway}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# update: o Hibernate cria/altera as tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger (springdocs
# http://localhost:8080/docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method